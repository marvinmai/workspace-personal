# Managed by workspace-personal (applications/lazygit/install_lazygit.py).
os:
  # Homebrew installs Helix as `hx`; the plain `helix` preset would call `helix`.
  editPreset: helix (hx)

git:
  # Press | in lazygit to cycle through these renderers
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      name: delta
    - command: delta --{{colorScheme}} --paging=never --side-by-side --width={{width}}
      name: delta side-by-side
    - type: rawGit
      name: default
